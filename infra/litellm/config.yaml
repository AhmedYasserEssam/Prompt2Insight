model_list:
  - model_name: sql-planner-primary
    litellm_params:
      model: os.environ/SQL_PLANNER_PRIMARY_MODEL
      api_key: os.environ/GROQ_API_KEY
      timeout: os.environ/LITELLM_TIMEOUT_SECONDS

  - model_name: sql-planner-fallback
    litellm_params:
      model: os.environ/SQL_PLANNER_FALLBACK_MODEL
      api_key: os.environ/GROQ_API_KEY
      timeout: os.environ/LITELLM_TIMEOUT_SECONDS

  - model_name: answer-primary
    litellm_params:
      model: os.environ/LITELLM_ANSWER_PRIMARY_MODEL
      api_key: os.environ/GROQ_API_KEY
      timeout: os.environ/LITELLM_TIMEOUT_SECONDS

  - model_name: answer-fallback
    litellm_params:
      model: os.environ/LITELLM_ANSWER_FALLBACK_MODEL
      api_key: os.environ/GROQ_API_KEY
      timeout: os.environ/LITELLM_TIMEOUT_SECONDS

router_settings:
  num_retries: 1
  timeout: 12
  allowed_fails: 2
  cooldown_time: 60
  fallbacks:
    - sql-planner-primary:
        - sql-planner-fallback
    - answer-primary:
        - answer-fallback

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY

litellm_settings:
  drop_params: true
