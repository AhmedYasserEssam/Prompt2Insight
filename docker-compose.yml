services:
  app-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: prompt2insight
      POSTGRES_USER: prompt2insight
      POSTGRES_PASSWORD: prompt2insight
    ports:
      - "5432:5432"
    volumes:
      - app_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prompt2insight -d prompt2insight"]
      interval: 5s
      timeout: 5s
      retries: 10

  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    env_file: [.env]
    volumes:
      - ./infra/litellm/config.yaml:/app/config.yaml:ro
    ports:
      - "4000:4000"

  backend:
    build: ./backend
    env_file: [.env]
    environment:
      APP_DATABASE_URL: postgresql+asyncpg://prompt2insight:prompt2insight@app-db:5432/prompt2insight
      LITELLM_BASE_URL: http://litellm:4000/v1
    depends_on:
      app-db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./catalogs:/catalogs:ro

  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api/v1
    depends_on: [backend]
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

volumes:
  app_db_data:
  frontend_node_modules:
