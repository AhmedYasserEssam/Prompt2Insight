catalog_version: "1.0"

metrics:
  revenue:
    labels:
      en: Revenue
      ar: الإيرادات
    aliases:
      en: [revenue, total revenue, net sales]
      ar: [الإيراد, الإيرادات, إجمالي الإيرادات, صافي المبيعات, المبيعات]
    descriptions:
      en: Net recognized revenue excluding tax.
      ar: صافي الإيرادات المثبتة باستثناء الضرائب.
    expressions:
      postgres: SUM(analytics.order_items.net_amount)
      mysql: SUM(analytics.order_items.net_amount)
    allowed_dimensions: [order_month, product_category, region]

dimensions:
  order_month:
    labels:
      en: Order month
      ar: شهر الطلب
    aliases:
      en: [month, monthly, order month]
      ar: [الشهر, شهري, شهر الطلب, حسب الشهر]
    expressions:
      postgres: DATE_TRUNC('month', analytics.orders.created_at)
      mysql: DATE_FORMAT(analytics.orders.created_at, '%Y-%m-01')

  product_category:
    labels:
      en: Product category
      ar: فئة المنتج
    aliases:
      en: [category, product category]
      ar: [الفئة, فئة المنتج, تصنيف المنتج]
    expressions:
      postgres: analytics.products.category
      mysql: analytics.products.category

join_contracts:
  - left: analytics.order_items.order_id
    right: analytics.orders.id
    relationship: many_to_one
    allowed_types: [inner]

column_policies:
  analytics.customers.email: sensitive
  analytics.customers.phone: prohibited
  analytics.order_items.net_amount: non_sensitive
  analytics.orders.created_at: non_sensitive

privacy:
  privacy_unit: analytics.orders.customer_id
  minimum_group_size: 5
